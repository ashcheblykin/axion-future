</head>

<!-- ═══ the shell. The rail and the assistant hold their width, the stage takes
     what is left, and anything that can outgrow its room scrolls inside it.
     Nothing is scaled: the design's numbers are the numbers. ═══════════════ -->
<div class="app" id="app" data-lens="location" data-layout="columns" data-listen="off" data-voice="idle">

  <!-- the planet is drawn on the viewport; the stage's clear area is only the
       aperture it is seated in. See assets/focus/globe/aperture.js -->
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="pins" id="pins" aria-label="The documented cases, on the planet"></div>

  <!-- The environment lens: full bleed, behind everything. Alone among the
       readings this one is a measurement rather than a drawing — the Olaya
       Street capture, drawn by Spark on the canvas below. The photograph stays
       in the markup underneath it as what a machine without WebGL2 is shown
       instead, and is only ever fetched in that case. -->
  <div class="backdrop">
    <div class="lens lens--scene">
      <canvas class="scene" id="scene3d"></canvas>
      <img data-src="assets/focus/img/scene-street.jpg" alt="" class="scene scene-still" id="sceneStill" decoding="async" fetchpriority="low" hidden>
      <p class="scene-note" id="sceneNote"></p>
    </div>
  </div>

  <div class="shell">

    <button class="rail-peek btn-ghost" id="railPeek" type="button" aria-label="Show the rail" hidden>
      <svg class="ic ic20"><use href="#i-sidebar"/></svg>
    </button>

    <!-- ═══ the rail ═══════════════════════════════════════════════════════ -->
    <nav class="panel rail" id="rail" aria-label="Sections">
      <button class="logo" type="button" aria-label="MOMAH — home"><img src="assets/focus/img/logo-momah.svg" alt="" width="44" height="44"></button>
      <div class="rail-nav">
        <button class="btn-ghost btn36 is-on" type="button" aria-label="Focus" aria-current="page"><svg class="ic ic20"><use href="#i-house-fill"/></svg></button>
        <button class="btn-ghost btn36" type="button" aria-label="Library"><svg class="ic ic20"><use href="#i-book"/></svg></button>
        <button class="btn-ghost btn36" type="button" aria-label="Boards"><svg class="ic ic20"><use href="#i-cards-nav"/></svg></button>
        <button class="btn-ghost btn36" type="button" aria-label="People"><svg class="ic ic20"><use href="#i-user"/></svg></button>
      </div>
      <button class="btn-ghost btn36" id="railToggle" type="button" aria-label="Hide the rail"><svg class="ic ic20"><use href="#i-sidebar"/></svg></button>
      <div class="rail-profile"><button class="avatar" type="button" aria-label="Account — AS">AS</button></div>
    </nav>

    <!-- ═══ the stage and everything that floats on it ═════════════════════ -->
    <main class="work" id="work">

      <nav class="scale-bar" id="scaleBar" aria-label="Where the planet is pointed" hidden></nav>

      <div class="stage" id="stage">
        <div class="stage-free" id="stageFree">
          <!-- the clip, on the place it was taken -->
          <div class="lens lens--media">
            <div class="media" id="media"></div>
            <p class="where" id="where" hidden></p>
          </div>
          <!-- the objects the register holds under this case, read through the
               same lens: what was detected, where, how often, how long ago -->
          <div class="lens lens--objects">
            <div class="objects" id="objects"></div>
          </div>
        </div>
      </div>

      <!-- at the frame's width these two are pinned to the stage's corners and the
           wrapper is display:contents; on a small screen it becomes the row -->
      <div class="headers">
      <header class="panel gen-header title" id="titleBar">
        <div class="nav-pair">
          <button class="btn-ghost btn28" id="prevSubject" type="button" aria-label="Previous signal"><svg class="ic ic16"><use href="#i-caret-left"/></svg></button>
          <button class="btn-ghost btn28" id="nextSubject" type="button" aria-label="Next signal"><svg class="ic ic16"><use href="#i-caret-right"/></svg></button>
        </div>
        <div class="title-text">
          <span class="title-1" id="titleName">KSA insights</span>
          <span class="title-2" id="titleSub">in Focus</span>
        </div>
        <button class="time-chip" type="button" id="timeChip" hidden title="Back to now"></button>
      </header>

      <div class="panel gen-header tools">
        <div class="seg">
          <button class="seg-btn" type="button" aria-label="Cards"><svg class="ic ic20"><use href="#i-cards"/></svg></button>
          <button class="seg-btn seg-dim" id="toggleAssistant" type="button" aria-label="Hide the assistant" aria-pressed="true"><svg class="ic ic20"><use href="#i-list"/></svg></button>
          <button class="seg-btn is-solid" type="button" aria-label="Grid"><svg class="ic ic20"><use href="#i-dots"/></svg></button>
        </div>
        <button class="cta-listen" id="listen" type="button" aria-pressed="false">
          <svg class="ic ic20"><use href="#i-wave"/></svg>
          <span id="listenLabel">Ask Axi</span>
        </button>
      </div>

      <!-- Which of the four faces the work area is showing. A phone holds one
           at a time, so the four things the frame lays out side by side —
           the reading, what happened, what to do about it, the thread — become
           four stops on one strip. It is a .seg-slide like every other choice
           on this screen, so seg.js carries the same chip across it, and it is
           drawn only inside the phone's own breakpoint; at the frame's width
           it is display:none and the four are side by side as before. -->
      <div class="seg seg-text seg-slide pane-strip" id="paneTabs" role="group" aria-label="Which face"></div>
      </div>

      <section class="col col-left" id="colLeft" aria-label="What happened"></section>
      <section class="col col-right" id="colRight" aria-label="The slice that allowed it"></section>

      <!-- The sparkle, opened. One bar for the whole screen, seated on whichever
           reading was asked: the two columns and the objects grid are written
           again whenever the subject or the month changes, so a field living
           inside a card would lose what had been typed into it half way through
           a sentence. The chip at its end is the same 20×20 the closed sparkle
           is, in the same place — the bar grows out of it and folds back into
           it, so what the reader clicked is what they are now typing in. -->
      <div class="askbar" id="askBar" role="group" aria-label="Ask about this reading" hidden>
        <div class="askbar-in">
          <button class="btn-ghost btn28" id="askMic" type="button" aria-pressed="false" aria-label="Speak the question">
            <svg class="ic ic16"><use href="#i-mic"/></svg>
          </button>
          <input class="askbar-field" id="askInput" type="text" autocomplete="off"
                 placeholder="Ask about this" aria-label="Ask about this reading">
        </div>
        <button class="ask askbar-spark" id="askSpark" type="button" aria-label="Send the question">
          <img src="assets/focus/img/sparkle.svg" alt="" width="16" height="16">
        </button>
      </div>

      <!-- The foot of the work area carries two plates, side by side, in the
           order they are read: which signal, then when. The ribbon on the left
           is the choice of subject; the strip on the right is the scale of time
           that subject is read on. -->
      <div class="dock" id="dock">
        <section class="panel signalbar" id="signalbar" aria-label="Signals and insights">
          <div class="signalbar-head">
            <span class="signalbar-title">Signals</span>
            <div class="seg seg-text seg-slide" id="lensTabs" role="group" aria-label="Readings"></div>
          </div>
          <div class="signals" id="signals" tabindex="0" role="listbox" aria-orientation="horizontal" aria-label="The signals shelf"></div>
        </section>

        <footer class="panel timebar" id="timebar">
          <div class="tl-chrome">
            <span class="tl-month" id="tlDate"></span>
            <p class="tl-read"><span id="tlValue"></span><i class="tl-sep" id="tlSep" hidden> &middot; </i><b id="tlBranch"></b></p>
            <button class="btn btn-glass tl-now" type="button" id="tlNow" hidden>Back to now</button>
            <div class="seg seg-text seg-slide" id="tlBranches" role="group" aria-label="Which forecast">
              <button class="seg-btn tl-b-base" type="button" data-branch="base">No action</button>
              <button class="seg-btn tl-b-act" type="button" data-branch="act">With action package</button>
            </div>
          </div>
          <div class="tl-plot">
            <!-- the record's ground, reaching the plate's own edge -->
            <div class="tl-past" id="tlPast" aria-hidden="true"></div>
            <div class="tl-track" id="tlTrack" role="slider" tabindex="0"
                 aria-label="Month on the record and the forecast"
                 aria-valuemin="0" aria-valuemax="30" aria-valuenow="17">
              <canvas id="tlCanvas" aria-hidden="true"></canvas>
              <div class="tl-layer" id="tlMarks"></div>
              <div class="tl-layer" id="tlPoints"></div>
              <div class="tl-layer" id="tlRisks"></div>
              <div class="tl-handle" id="tlHandle"></div>
            </div>
            <div class="tl-months" id="tlMonths" aria-hidden="true"></div>
          </div>
        </footer>
      </div>

    </main>

    <!-- ═══ the assistant ══════════════════════════════════════════════════ -->
    <aside class="panel assistant" id="assistant" aria-label="Agent">
      <div class="assistant-glow" aria-hidden="true"><img src="assets/focus/img/assistant-glow.svg" alt=""></div>

      <header class="assistant-head">
        <button class="btn-ghost btn36" type="button" aria-label="Thread menu"><svg class="ic ic20"><use href="#i-list-thin"/></svg></button>
        <button class="assistant-title" id="threadTitle" type="button" aria-expanded="false">
          <span>Agent&rsquo;s insights</span>
          <svg class="ic ic16 caret"><use href="#i-caret-down"/></svg>
        </button>
        <button class="btn-ghost btn36" id="closeAssistant" type="button" aria-label="Close the assistant"><svg class="ic ic20"><use href="#i-x"/></svg></button>
      </header>

      <div class="assistant-body" id="thread" tabindex="0" aria-live="polite" aria-label="The conversation"></div>

      <!-- The bar is where a question is put, and nothing else: what is heard
           is read in the thread itself, on the live line the foot of the
           conversation ends on. focus.js writes it there. -->
      <div class="assistant-input">
        <div class="input" id="inputBar">
          <button class="btn-ghost btn36" id="mic" type="button" aria-label="Speak to the agent" aria-pressed="false"><svg class="ic ic20"><use href="#i-mic"/></svg></button>
          <div class="wave" id="wave" aria-hidden="true"></div>
          <input class="ask-field" id="askField" type="text" placeholder="Ask the agent" aria-label="Ask the agent">
          <button class="btn-ghost btn36" id="send" type="button" aria-label="Send"><svg class="ic ic20"><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>
    </aside>

  </div>
</div>

<!-- the source document, verbatim -->
<script defer src="assets/js/data/world-110m.js"></script>
<script defer src="assets/js/data/cv-core.js"></script>

<!-- the planet: the City View renderer, its aperture pointed at the stage -->
